<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxLog Settings</title>
    <link rel="stylesheet" href="src/theme.css">
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        width: 300px;
        background: var(--fl-page);
        color: var(--fl-text);
        font: 13px/1.4 var(--fl-font);
        }

        .popup-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        background: var(--fl-card);
        border-bottom: 1px solid var(--fl-border);
        }

        .popup-header img {
        width: 32px;
        height: 32px;
        }

        .popup-header h1 {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
        }

        .popup-content {
        display: grid;
        gap: 8px;
        padding: 16px 20px;
        }

        .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        background: var(--fl-card);
        border: 1px solid var(--fl-border);
        border-radius: var(--fl-r-lg);
        }

        .setting-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
        font-weight: 600;
        }

        .setting-label svg {
        flex: none;
        width: 18px;
        height: 18px;
        color: var(--fl-text-3);
        }

        .setting-text {
        display: grid;
        gap: 2px;
        }

        .setting-hint {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--fl-text-3);
        }

        .toggle-switch {
        position: relative;
        flex: none;
        width: 38px;
        height: 22px;
        border: 0;
        border-radius: var(--fl-r-pill);
        background: var(--fl-switch-off);
        cursor: pointer;
        transition: background var(--fl-dur);
        }

        .toggle-switch::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform var(--fl-dur) var(--fl-ease);
        }

        .toggle-switch.active {
        background: var(--fl-accent);
        }

        .toggle-switch.active::before {
        transform: translateX(16px);
        }

        .toggle-switch:focus-visible {
        outline: 2px solid var(--fl-focus);
        outline-offset: 2px;
        }

        .popup-footer {
        padding: 10px 20px;
        background: var(--fl-card);
        border-top: 1px solid var(--fl-border);
        font-size: 11.5px;
        color: var(--fl-text-3);
        text-align: center;
        }

        .version {
        font-weight: 600;
        color: var(--fl-accent-fg);
        font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="fl-theme">
  <header class="popup-header">
    <img src="src/assets/icon48.png" alt="">
    <h1>FoxLog</h1>
  </header>

  <main class="popup-content">
    <div class="setting-item">
      <div class="setting-label">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
        </svg>
        <span id="toggle-label" data-i18n="showButton">Afficher le bouton</span>
      </div>
      <button type="button" class="toggle-switch" id="toggle-button" role="switch" aria-checked="true" aria-labelledby="toggle-label"></button>
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
        </svg>
        <span class="setting-text">
          <span id="alerts-label" data-i18n="errorAlerts">Alertes d'erreur</span>
          <span id="alerts-hint" class="setting-hint" data-i18n="errorAlertsHint">Badge et notification quand un nouveau log contient une erreur</span>
        </span>
      </div>
      <button type="button" class="toggle-switch" id="toggle-alerts" role="switch" aria-checked="true" aria-labelledby="alerts-label" aria-describedby="alerts-hint"></button>
    </div>
  </main>

  <footer class="popup-footer">
    <span data-i18n="version">Version</span> <span class="version" id="version-number"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
