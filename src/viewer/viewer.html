<!DOCTYPE html>
<!-- Full-page log analysis, opened by "Open in a new tab". See docs/tech-solution/open-in-new-tab.md -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoxLog</title>
  <link rel="icon" type="image/png" href="../assets/icon48.png">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../modal-styles.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="fl-theme foxlog-viewer">
  <div id="foxlog-viewer-status" class="foxlog-viewer-status" role="status" aria-live="polite">

  <script src="../ui/toast-manager.js"></script>

  <script src="../ui/modal-tabs/tab-utils.js"></script>
  <script src="../ui/modal-tabs/summary-tab.js"></script>
  <script src="../ui/modal-tabs/analysis-export.js"></script>
  <script src="../ui/modal-tabs/analysis-tab.js"></script>

  <script src="../ui/modal-tabs/diff-tab.js"></script>
  <script src="../ui/modal-manager.js"></script>
  <script src="viewer.js"></script>
